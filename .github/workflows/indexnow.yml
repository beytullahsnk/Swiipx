# Prévient Bing (IndexNow) à chaque publication d'article.
#
# Tourne sur GitHub, pas sur le Mac : il ne dépend ni d'un ordinateur allumé,
# ni d'une tâche installée, ni de la façon dont le push a été fait. Le script
# attend que le déploiement Vercel soit en ligne avant de signaler quoi que ce
# soit — voir scripts/indexnow-apres-deploiement.mjs.
#
# Lancement manuel (onglet Actions > IndexNow > Run workflow) : signale TOUT le
# sitemap, par exemple après une refonte. Cocher « simulation » pour vérifier
# sans rien transmettre.
#
# Appel par « Publication des articles » (workflow_call) : les articles mis en
# ligne par la routine sont poussés sur main par le jeton de GitHub, qui ne
# déclenche aucun workflow. Ce workflow-là appelle donc celui-ci lui-même, en
# indiquant les commits avant et après la publication.

name: Indexation (Bing et Google)

on:
  push:
    branches: [main]
    paths:
      - 'app/blog/**'
  workflow_dispatch:
    inputs:
      simulation:
        description: "Simulation : lister les URL sans rien transmettre"
        type: boolean
        default: false
      google_seul:
        description: "Google seulement : renvoyer le sitemap à Search Console, sans rien signaler à Bing"
        type: boolean
        default: false
  workflow_call:
    inputs:
      avant:
        description: "Commit de main avant la publication"
        type: string
        required: true
      apres:
        description: "Commit de main après la publication"
        type: string
        required: true

permissions:
  contents: read
  # Jeton d'identité GitHub (OIDC), échangé contre un accès Google d'une heure :
  # voir l'étape « Google — identité de GitHub » plus bas.
  id-token: write

# Deux publications rapprochées s'enchaînent au lieu de s'annuler : annuler la
# première ferait perdre son signalement.
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  signaler:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.apres || github.sha }}
          # Historique complet : il faut pouvoir relire seo-data.ts tel qu'il
          # était avant le push pour savoir ce qui a changé.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Articles nouveaux, modifiés ou supprimés
        if: github.event_name == 'push' || inputs.apres != ''
        env:
          AVANT: ${{ inputs.avant || github.event.before }}
          APRES: ${{ inputs.apres || github.sha }}
        run: node scripts/indexnow-apres-deploiement.mjs "$AVANT" "$APRES"

      - name: Tout le sitemap
        if: github.event_name == 'workflow_dispatch' && !inputs.google_seul
        env:
          SIMULATION: ${{ inputs.simulation }}
        run: |
          if [ "$SIMULATION" = "true" ]; then
            node scripts/indexnow.mjs --simulation
          else
            node scripts/indexnow.mjs
          fi

      # Google ne lit pas IndexNow : on lui renvoie le sitemap par l'API Search
      # Console, une fois le deploiement en ligne (l'etape precedente l'attend).
      #
      # SANS CLE : GitHub prouve son identite a Google (federation d'identite du
      # projet Google Cloud « swiipx », pool « github »), qui lui confie pour
      # une heure le compte technique swiipx-sitemap, utilisateur « Acces total »
      # de swiipx.fr dans Search Console. Google n'accepte que les depots du
      # compte beytullahsnk, branche main ; et seul le depot Swiipx peut
      # emprunter ce compte. Aucune cle a stocker, a copier ni a renouveler.
      # Un echec ici ne fait pas echouer la publication : l'article est en
      # ligne et Bing est deja prevenu. Il apparait en avertissement.
      - name: Google — identité de GitHub (sans clé)
        id: google
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/649737599394/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: swiipx-sitemap@swiipx.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters
          create_credentials_file: false

      - name: Google — sitemap renvoyé à Search Console
        continue-on-error: true
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SIMULATION: ${{ inputs.simulation }}
        run: |
          if [ "$SIMULATION" = "true" ]; then
            node scripts/google-sitemap.mjs --simulation
          else
            node scripts/google-sitemap.mjs
          fi
